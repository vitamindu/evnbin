name: Deploy game server (Fly.io)

on:
  push:
    paths:
      - 'server/**'
      - 'src/game/**'
      - 'src/data/**'
      - 'src/net/protocol.ts'
      - 'Dockerfile'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # 기본 브랜치에서만 배포한다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: fightguys-evnbin
    steps:
      - uses: actions/checkout@v5
      - name: Fly 토큰이 없으면 건너뛰기
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN secret is not set yet, skipping the server deploy."
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: 앱이 없으면 만들기
        if: env.FLY_API_TOKEN != ''
        run: flyctl status --app "$FLY_APP" >/dev/null 2>&1 || flyctl apps create "$FLY_APP" --org personal
      - name: 배포(서버 1대)
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false --app "$FLY_APP"
